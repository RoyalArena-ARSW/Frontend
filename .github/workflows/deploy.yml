name: Deploy Frontend to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:  
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: royalarenaregistry.azurecr.io
        username: ${{ secrets.AZURE_ACR_USERNAME }}
        password: ${{ secrets.AZURE_ACR_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t royalarenaregistry.azurecr.io/frontend-microservice:latest .
        docker push royalarenaregistry.azurecr.io/frontend-microservice:latest

    - name: Update Container App via Azure CLI
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az login --service-principal -u ${{ secrets.AZURE_ACR_USERNAME }} -p ${{ secrets.AZURE_ACR_PASSWORD }} --tenant <tu-tenant-id>
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name gameengine-microservice \
            --resource-group royalarena-frontend_group \
            --image royalarenaregistry.azurecr.io/frontend-microservice:latest